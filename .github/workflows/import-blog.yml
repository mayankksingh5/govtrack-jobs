name: Publish blog articles

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/import-blog.mjs'
      - '.github/workflows/import-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/import-blog.test.mjs
      - run: node scripts/import-blog.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

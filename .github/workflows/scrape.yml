name: scrape

on:
  schedule:
    # Har 2 ghante. Private repo ka free Actions quota 2000 min/mahina hai;
    # har 30 min wala run (~1,440 runs/mahina) quota khatam kar deta tha.
    # GitHub free tier pe scheduled runs 5-20 min late bhi chal sakte hain.
    - cron: '17 */2 * * *'
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # supabase-js needs Node 22+ (native WebSocket); on Node 20 it throws at createClient.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: node scraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PDF parsing took most of the ~8 min run and its output only goes
          # to a log file that the runner discards.
          SCRAPER_PARSE_PDFS: 'false'
